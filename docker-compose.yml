services:
  core-business-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: core-business-service
    ports:
      - "${APP_PORT:-8090}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      NOTIFICATION_SERVICE_URL: "${NOTIFICATION_SERVICE_URL:-http://localhost:8000}"
      REQUEST_TIMEOUT_SECONDS: "${REQUEST_TIMEOUT_SECONDS:-5}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DB_NAME:-CoreBusinessDb};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Your_strong_password123};TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_started
    networks:
      - smart-campus

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: core-business-sqlserver
    ports:
      - "${SQLSERVER_PORT:-1434}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Your_strong_password123}"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - smart-campus

networks:
  smart-campus:
    driver: bridge

volumes:
  sqlserver-data:
